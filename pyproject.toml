[project]
name = "duckdb-duck-lineage"
version = "0.1.0"
description = "DuckDB extension for OpenLineage integration"
readme = "README.md"
# Upper bound: DuckDB 2.0's format check builds its venv from this Python, and cmake-format 0.6.13 does not run on
# Python 3.15 ("Cannot use capturing groups in re.Scanner"). uv picks the newest version allowed here.
requires-python = ">=3.11,<3.14"
dependencies = [
    # Must match the black that DuckDB's format check uses (duckdb/scripts/format.py, DuckDB 2.0: 24.10.0)
    "black==24.10.0",
    "clang-format==11.0.1",
    "cmake-format>=0.6.13",
    "cxxheaderparser>=1.7.0",
    "marquez-python>=0.50.0",
    "pcpp>=1.30",
    "pytz>=2025.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.23.0",
    "duckdb==2.0.1",
    "requests>=2.33.0",
    "pyyaml>=6.0",
]
tidy = ["pybind11[global]>=3.0.1", "clang-tidy>=20.1.0"]

[tool.black]
# Pin the target versions, so formatting doesn't depend on the Python version black runs under.
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["test/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--tb=short", "--strict-markers"]
timeout = 120
markers = [
    "integration: Integration tests requiring Marquez",
    "slow: Slow running tests",
    "smoke: Quick smoke tests",
    "ducklake_postgres: DuckLake tests with PostgreSQL metadata + S3 storage",
    "demo: Demo quickstart E2E tests",
]
truncation_limit_lines = 10000
truncation_limit_chars = 90000
